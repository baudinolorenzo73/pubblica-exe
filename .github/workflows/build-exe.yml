# Compila l'EXE per Windows a ogni invio (o a mano: Actions → Build EXE → Run workflow)
# e lo pubblica nelle Releases del repository. Generato da Pubblica · by Lollo ®2026
name: Build EXE

on:
  push:
    paths-ignore:
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

# Un nuovo invio annulla la compilazione precedente ancora in corso
concurrency:
  group: build-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip                              # le librerie già scaricate restano: ricompilare è più veloce
          cache-dependency-path: requirements.txt

      - name: PyInstaller e librerie
        run: |
          python -m pip install --upgrade pip
          pip install "pyinstaller>=6.10,<7" pillow
          pip install -r requirements.txt

      - name: Compila EXE
        run: python crea_exe.py

      - name: Installa Inno Setup
        if: hashFiles('installer.iss') != ''
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Compila installer
        if: hashFiles('installer.iss') != ''
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss'

      - name: Controllo del risultato
        run: Get-ChildItem uscita | Format-Table Name, Length

      - name: Salva tra gli artifact
        uses: actions/upload-artifact@v4
        with:
          name: exe
          path: uscita/*
          if-no-files-found: error

      - name: Pubblica nelle Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: exe-${{ github.run_number }}
          name: EXE build ${{ github.run_number }}
          body: |
            Programma per Windows creato con **Pubblica** · by Lollo ®2026

            **Come si usa:** scarica il file `.exe` qui sotto e fai doppio clic.
            Se Windows mostra «Windows ha protetto il PC», scegli **Ulteriori informazioni → Esegui comunque**:
            succede con tutti i programmi non firmati.

            Il file `.sha256` contiene l'impronta per controllare che il download sia integro
            (PowerShell: `Get-FileHash nomefile.exe`).

            Compilato dal commit ${{ github.sha }}.
          files: uscita/*
